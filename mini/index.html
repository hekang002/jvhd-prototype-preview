<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今晚喝点吗 · 小程序原型</title>
<link rel="stylesheet" href="../css/common.css?v=6">
<link rel="stylesheet" href="../css/mini.css?v=21">
</head>
<body>
<div class="stage">
  <aside class="stage-side">
    <a class="stage-back" href="../index.html">← 返回原型选择</a>
    <div class="stage-title">
      <div class="st-mark">今晚喝点吗</div>
      <div class="st-sub">小程序原型 · WeChat Mini Program</div>
    </div>

    <div class="stage-sec">演示导航</div>
    <div class="stage-nav" id="stage-nav"></div>

    <div class="stage-sec">演示场景</div>
    <div class="stage-scenes">
      <button class="sc" data-scene="drink"><b>记录一杯</b><span>首页点「喝」进入 30 秒记录</span></button>
      <button class="sc" data-scene="cooldown"><b>再想想</b><span>启动 10 分钟拖延冷却</span></button>
      <button class="sc" data-scene="fuel"><span style="display:flex;gap:6px;align-items:center"><b>加速演示</b><b style="color:var(--wk-amber)">×60</b></span><span>冷却按 10 秒结束，自动弹回询问</span></button>
      <button class="sc" data-scene="newuser"><b>新用户</b><span>重置为空白数据，体验首次使用</span></button>
    </div>

    <div class="stage-sec">说明</div>
    <ul class="stage-notes">
      <li>手机框模拟 375×812 视口，可滚动。</li>
      <li>所有操作写入 localStorage，刷新不丢失。</li>
      <li>酒精克数 = 量(ml) × 酒精度(%vol) ÷ 100 × 0.789</li>
      <li><a href="#" data-reset>重置演示数据</a></li>
    </ul>
    <div class="stage-foot">JVHD-SRS-2026-001 · V1.0 原型</div>
  </aside>

  <main class="stage-main">
    <div class="phone-wrap">
      <div class="phone">
        <div class="phone-sb">
          <span class="sb-time" id="sb-time">21:12</span>
          <span class="sb-island"></span>
          <span class="sb-icons">
            <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1" opacity=".45"/></svg>
            <svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M1 3.6a10 10 0 0 1 14 0"/><path d="M3.4 6.2a6.6 6.6 0 0 1 9.2 0"/><path d="M5.8 8.7a3.2 3.2 0 0 1 4.4 0"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".6" y=".6" width="21" height="10.8" rx="3" stroke="currentColor" opacity=".45"/><rect x="2.3" y="2.3" width="15" height="7.4" rx="1.8" fill="currentColor"/><path d="M23 4.2v3.6a1.9 1.9 0 0 0 0-3.6Z" fill="currentColor" opacity=".45"/></svg>
          </span>
        </div>

        <div class="phone-body" id="mini-root">
          <div class="mini-loading">加载中…</div>
        </div>

        <div id="mini-modal-n" style="display:none">0</div>
        <div class="phone-topbar">
          <div class="phone-shade"></div>
          <div class="pt-bg"></div>
          <span class="pc-title" id="pc-title">今晚喝点吗</span>
          <button class="pc-dots" id="pc-menu" title="小程序菜单（模拟）">
            <svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7.6" stroke="currentColor" stroke-width="1.2" fill="none"/><circle cx="6.2" cy="9" r="1.05" fill="currentColor"/><circle cx="9" cy="9" r="1.05" fill="currentColor"/><circle cx="11.8" cy="9" r="1.05" fill="currentColor"/></svg>
          </button>
          <span class="pc-capsule"><span class="dots3"><i></i><i></i><i></i></span><span class="sep"></span><span class="target"><i></i></span></span>
        </div>
      </div>
      <div class="phone-hint" id="phone-hint">原型演示 · 点击手机内的元素进行交互</div>
    </div>
  </main>
</div>

<script src="../js/core.js?v=13"></script>
<script src="../js/mock.js?v=11"></script>
<script src="app.js?v=13"></script>
</body>
</html>
